org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=false
# 构建机 JDK 候选目录（报告 P2-8）：本模组固定用 Java 17 工具链编译。
# Gradle 对列表里不存在的目录会直接跳过、不报错，所以在 Windows/macOS 上这行是无害的；
# 如果你机器的 JDK 17 不在标准位置，把它的目录追加到这里即可。
org.gradle.java.installations.paths=/opt/jdks/java-8,/opt/jdks/java-17,/usr/lib/jvm/java-21-openjdk-amd64,/opt/jdks/java-25
